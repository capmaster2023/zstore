# Compile Z-Store elle-même, la signe, crée une Release GitHub
# et (si les secrets Z-Store sont configurés) publie la mise à jour dans ta store.
name: Build Z-Store

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      ZSTORE_API_URL: ${{ secrets.ZSTORE_API_URL }}
      HAS_KEYSTORE: ${{ secrets.ZSTORE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Préparer la clé de signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ZSTORE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/zstore.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/zstore.jks" >> "$GITHUB_ENV"

      - name: Avertissement signature
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::Secret ZSTORE_KEYSTORE_BASE64 absent — APK signé avec une clé de debug (test uniquement)."

      - name: Compiler l'APK release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ZSTORE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZSTORE_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Z-Store-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Z-Store-${{ env.VERSION_NAME }}
          path: Z-Store-*.apk

      - name: Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Z-Store ${{ env.VERSION_NAME }}
          prerelease: ${{ env.HAS_KEYSTORE != 'true' }}
          files: Z-Store-*.apk

      - name: Publier la mise à jour dans Z-Store
        if: env.ZSTORE_API_URL != '' && env.HAS_KEYSTORE == 'true'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          CI_TOKEN: ${{ secrets.ZSTORE_CI_TOKEN }}
        run: |
          curl -sS --fail-with-body --max-time 600 -X POST "$ZSTORE_API_URL/ci/publish" \
            -H "X-ZStore-CI: $CI_TOKEN" \
            --form-string package_name=com.graceofgod.zstore \
            --form-string version_code="$VERSION_CODE" \
            --form-string version_name="$VERSION_NAME" \
            --form-string app_label="Z-Store" \
            --form-string min_sdk=26 \
            --form-string changelog="$COMMIT_MSG" \
            -F "apk=@Z-Store-$VERSION_NAME.apk;type=application/vnd.android.package-archive"
